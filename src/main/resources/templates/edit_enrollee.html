<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сохранение абитуриента</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1, h3 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #4a5568; }
        input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .error { color: #e74c3c; font-size: 0.85em; margin-top: 5px; font-weight: bold; }
        .btn-group { margin-top: 25px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 16px; display: inline-block; }
        .btn-primary { background-color: #2ecc71; color: white; margin-right: 10px; }
        .btn-secondary { background-color: #7f8c8d; color: white; }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Сохранение данных абитуриента</h1>

    <form th:action="@{/enrollees/save}" th:object="${enrollee}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{address.id}" />

        <h3>Личные данные</h3>
        <div class="form-group">
            <label>Фамилия:</label>
            <input type="text" th:field="*{lastName}" />
            <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>

        <div class="form-group">
            <label>Имя:</label>
            <input type="text" th:field="*{firstName}" />
            <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>

        <div class="form-group">
            <label>Отчество:</label>
            <input type="text" th:field="*{middleName}" />
        </div>

        <div class="form-group">
            <label>Пол:</label>
            <input type="text" th:field="*{gender}" />
            <div class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
        </div>

        <div class="form-group">
            <label>Национальность:</label>
            <input type="text" th:field="*{nationality}" />
            <div class="error" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
        </div>

        <div class="form-group">
            <label>Дата рождения:</label>
            <input type="date" th:field="*{birthDate}" />
            <div class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
        </div>

        <div class="form-group">
            <label>Проходной балл:</label>
            <input type="number" th:field="*{passingScore}" />
            <div class="error" th:if="${#fields.hasErrors('passingScore')}" th:errors="*{passingScore}"></div>
        </div>

        <h3>Домашний адрес</h3>
        <div class="form-group">
            <label>Индекс:</label>
            <input type="text" th:field="*{address.zipCode}" />
            <div class="error" th:if="${#fields.hasErrors('address.zipCode')}" th:errors="*{address.zipCode}"></div>
        </div>

        <div class="form-group">
            <label>Страна:</label>
            <input type="text" th:field="*{address.country}" />
            <div class="error" th:if="${#fields.hasErrors('address.country')}" th:errors="*{address.country}"></div>
        </div>

        <div class="form-group">
            <label>Город:</label>
            <input type="text" th:field="*{address.city}" />
            <div class="error" th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}"></div>
        </div>

        <div class="form-group">
            <label>Улица:</label>
            <input type="text" th:field="*{address.street}" />
            <div class="error" th:if="${#fields.hasErrors('address.street')}" th:errors="*{address.street}"></div>
        </div>

        <div class="form-group">
            <label>Дом:</label>
            <input type="text" th:field="*{address.house}" />
            <div class="error" th:if="${#fields.hasErrors('address.house')}" th:errors="*{address.house}"></div>
        </div>

        <div class="form-group">
            <label>Квартира:</label>
            <input type="text" th:field="*{address.apartment}" />
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/enrollees/main}" class="btn btn-secondary">Назад</a>
        </div>
    </form>
</div>
</body>
</html>
