<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Форма студента</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 6px; }
        .btn-save { background-color: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Сохранение данных студента</h1>
<form th:action="@{/students/save}" th:object="${student}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
        <label>Фамилия:</label>
        <input type="text" th:field="*{lastName}" required/>
    </div>
    <div class="form-group">
        <label>Имя:</label>
        <input type="text" th:field="*{firstName}" required/>
    </div>
    <div class="form-group">
        <label>Отчество:</label>
        <input type="text" th:field="*{middleName}"/>
    </div>
    <div class="form-group">
        <label>Город:</label>
        <input type="text" th:field="*{city}"/>
    </div>
    <div class="form-group">
        <label>Пол:</label>
        <input type="text" th:field="*{gender}"/>
    </div>
    <div class="form-group">
        <label>Возраст:</label>
        <input type="number" th:field="*{age}"/>
    </div>
    <div class="form-group">
        <label>Группа:</label>
        <input type="text" th:field="*{studentGroup}"/>
    </div>
    <div class="form-group">
        <label>Факультет:</label>
        <input type="text" th:field="*{faculty}"/>
    </div>

    <button type="submit" class="btn-save">Сохранить</button>
    <a th:href="@{/students/main}">Назад к списку</a>
</form>
</body>
</html>
