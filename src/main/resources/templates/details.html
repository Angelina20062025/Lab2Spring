<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Детали абитуриента</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 400px; }
    </style>
</head>
<body>
<h1>Абитуриент</h1>
<div class="card" th:object="${enrollee}">
    <p><strong>ID:</strong> <span th:text="*{id}"></span></p>
    <p><strong>ФИО:</strong> <span th:text="*{lastName + ' ' + firstName + ' ' + middleName}"></span></p>
    <p><strong>Пол:</strong> <span th:text="*{gender}"></span></p>
    <p><strong>Национальность:</strong> <span th:text="*{nationality}"></span></p>
    <p><strong>Дата рождения:</strong> <span th:text="*{birthDate}"></span></p>
    <p><strong>Экзамены:</strong> <span th:text="*{examScores}"></span></p>
    <p><strong>Проходной балл:</strong> <span th:text="*{passingScore}"></span></p>
</div>
<br/>
<a th:href="@{/enrollees/main}">Назад к списку</a>
</body>
</html>
