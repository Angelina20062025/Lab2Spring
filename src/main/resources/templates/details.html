<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали абитуриента</title>
</head>
<body>
<h1>Карточка абитуриента</h1>
<div>
    <p><strong>ID:</strong> <span th:text="${enrollee.id}"></span></p>
    <p><strong>ФИО:</strong> <span th:text="${enrollee.lastName + ' ' + enrollee.firstName + ' ' + enrollee.middleName}"></span></p>
    <p><strong>Пол:</strong> <span th:text="${enrollee.gender}"></span></p>
    <p><strong>Национальность:</strong> <span th:text="${enrollee.nationality}"></span></p>
    <p><strong>Дата рождения:</strong> <span th:text="${enrollee.birthDate}"></span></p>
    <p><strong>Проходной балл:</strong> <span th:text="${enrollee.passingScore}"></span></p>

    <h3>Адрес проживания:</h3>
    <div th:if="${enrollee.address != null}">
        <p><strong>Индекс:</strong> <span th:text="${enrollee.address.zipCode}"></span></p>
        <p><strong>Страна:</strong> <span th:text="${enrollee.address.country}"></span></p>
        <p><strong>Город:</strong> <span th:text="${enrollee.address.city}"></span></p>
        <p><strong>Улица, дом, кв:</strong>
            <span th:text="${enrollee.address.street + ', д. ' + enrollee.address.house + ', кв. ' + enrollee.address.apartment}"></span>
        </p>
    </div>
    <div th:if="${enrollee.address == null}">
        <p>Адрес не указан.</p>
    </div>
</div>
<br>
<a th:href="@{/enrollees/main}">Назад к списку</a>
</body>
</html>
